packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.0
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: 2.1.1
  drizzle-orm: ^0.45.1
  framer-motion: 12.35.1
  lucide-react: 0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: 3.5.0
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.0
  zod: ^3.25.76

minimumReleaseAge: 1440

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
  esbuild: 0.27.3
  # D10: Pin critical/high transitive deps to patched versions.
  # Fixed: protobufjs, axios, nanoid, linkify-it, ws, vite, brace-expansion,
  # js-yaml, fast-uri. Reduced from 77 vulns (1 critical) to 15 (0 critical).
  # Remaining 9 high are in build-time-only transitive deps:
  #   - 5x fast-uri via orval (API codegen, dev-only)
  #   - 2x browserslist via @babel (build-time, dev-only)
  #   - 1x sharp via @xenova/transformers (optional peer dep, not installed)
  #   - 1x ip-address via express-rate-limit (runtime but low practical risk)
  protobufjs: '>=7.5.6'
  axios: '>=1.16.0'
  nanoid: '>=3.3.12'
  linkify-it: '>=5.0.2'
  ws: '>=8.21.0'
  vite: '>=7.3.5'
  brace-expansion: '>=5.0.7'
  js-yaml: '>=4.3.0'
  fast-uri: '>=0.2.4'
